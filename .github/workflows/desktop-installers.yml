# Unsigned installers. Signing keys are not in this repo.
# Windows: NSIS and MSI. macOS: a universal dmg. Linux: deb, AppImage, and rpm.
# Each installer carries a Python runtime (scripts/build_desktop_runtime.py).
# The smoke jobs install every installer on a clean runner and run the installed
# app with --smoke-test. The release job runs only on a tag, after all of them.
# The cargo workspace root is desktop/, so bundles land in desktop/target,
# not desktop/src-tauri/target. CARGO_TARGET_DIR makes that directory explicit.
name: desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundled Python runtime
        run: python scripts/build_desktop_runtime.py --triple x86_64-pc-windows-msvc --out desktop/src-tauri/runtime/python-x86_64-pc-windows-msvc.tar.gz
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build unsigned NSIS and MSI
        working-directory: desktop
        run: npm run build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find desktop/target -type f \( -name '*.exe' -o -name '*.msi' \) -path '*/release/bundle/*' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(find dist -name '*.exe' | head -n 1)"
          test -n "$(find dist -name '*.msi' | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both bundled Python runtimes
        run: |
          python scripts/build_desktop_runtime.py --triple aarch64-apple-darwin --out desktop/src-tauri/runtime/python-aarch64-apple-darwin.tar.gz
          python scripts/build_desktop_runtime.py --triple x86_64-apple-darwin --out desktop/src-tauri/runtime/python-x86_64-apple-darwin.tar.gz
      - name: Install both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build an unsigned universal dmg
        working-directory: desktop
        run: npm run build -- --target universal-apple-darwin
      - name: Collect installers
        run: |
          mkdir -p dist
          find desktop/target -type f -name '*.dmg' -path '*/release/bundle/*' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(find dist -name '*.dmg' | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-macos
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential pkg-config libssl-dev file rpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundled Python runtime
        run: python scripts/build_desktop_runtime.py --triple x86_64-unknown-linux-gnu --out desktop/src-tauri/runtime/python-x86_64-unknown-linux-gnu.tar.gz
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build unsigned deb, AppImage, and rpm
        working-directory: desktop
        run: npm run build
      - name: Collect installers
        run: |
          mkdir -p dist
          find desktop/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -path '*/release/bundle/*' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(find dist -name '*.deb' | head -n 1)"
          test -n "$(find dist -name '*.AppImage' | head -n 1)"
          test -n "$(find dist -name '*.rpm' | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-linux
          path: dist/*
          if-no-files-found: error

  smoke-windows:
    needs: [windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyagent-windows
          path: dist
      - name: Install the NSIS installer silently and run the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'EasyAgent\easyagent-desktop.exe'
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          $result = Join-Path $env:RUNNER_TEMP 'nsis.json'
          $env:EASYAGENT_PORT = '45101'
          $proc = Start-Process -FilePath $app -ArgumentList '--smoke-test', $result -PassThru
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw 'the app did not finish in 300 s' }
          $log = Join-Path $env:LOCALAPPDATA 'labs.1bit.easyagent\logs\server.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (-not (Test-Path $result)) { throw 'no smoke result' }
          Get-Content $result
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw 'NSIS install smoke test failed' }
      - name: Install the MSI and run the installed app
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'labs.1bit.easyagent') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA 'labs.1bit.easyagent') -ErrorAction SilentlyContinue
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 60; throw "msiexec exit $($install.ExitCode)" }
          $app = Get-ChildItem 'C:\Program Files\EasyAgent', 'C:\Program Files (x86)\EasyAgent' -Filter easyagent-desktop.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'MSI did not install easyagent-desktop.exe' }
          $result = Join-Path $env:RUNNER_TEMP 'msi.json'
          $env:EASYAGENT_PORT = '45102'
          $proc = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test', $result -PassThru
          if (-not $proc.WaitForExit(300000)) { $proc.Kill(); throw 'the app did not finish in 300 s' }
          $log = Join-Path $env:LOCALAPPDATA 'labs.1bit.easyagent\logs\server.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (-not (Test-Path $result)) { throw 'no smoke result' }
          Get-Content $result
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw 'MSI install smoke test failed' }

  smoke-macos:
    needs: [macos]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyagent-macos
          path: dist
      - name: Copy the app out of the dmg and run it
        run: |
          uname -m
          dmg=$(ls dist/*.dmg | head -n 1)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -n 1 | sed 's/.*\(\/Volumes\/.*\)/\1/')
          cp -R "$mount/EasyAgent.app" /Applications/
          hdiutil detach "$mount"
          app=/Applications/EasyAgent.app/Contents/MacOS/easyagent-desktop
          lipo -archs "$app"
          export EASYAGENT_PORT=45103
          set +e
          perl -e 'alarm 300; exec @ARGV' "$app" --smoke-test "$RUNNER_TEMP/dmg.json"
          code=$?
          set -e
          tail -n 40 "$HOME/Library/Logs/labs.1bit.easyagent/server.log" || true
          cat "$RUNNER_TEMP/dmg.json"
          test "$code" -eq 0
          python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ok'] else 1)" "$RUNNER_TEMP/dmg.json"

  smoke-linux:
    needs: [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyagent-linux
          path: dist
      - name: Display and session bus
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 xauth
      - name: Install the deb and run the installed app
        run: |
          sudo apt-get install -y ./dist/*.deb
          export EASYAGENT_PORT=45104
          set +e
          timeout 300 dbus-run-session -- xvfb-run -a easyagent-desktop --smoke-test "$RUNNER_TEMP/deb.json"
          code=$?
          set -e
          tail -n 40 "$HOME/.local/share/labs.1bit.easyagent/logs/server.log" || true
          cat "$RUNNER_TEMP/deb.json"
          test "$code" -eq 0
          python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ok'] else 1)" "$RUNNER_TEMP/deb.json"
      - name: Run the AppImage
        run: |
          rm -rf "$HOME/.local/share/labs.1bit.easyagent"
          image=$(ls dist/*.AppImage | head -n 1)
          chmod +x "$image"
          export EASYAGENT_PORT=45105 APPIMAGE_EXTRACT_AND_RUN=1
          set +e
          timeout 300 dbus-run-session -- xvfb-run -a "$image" --smoke-test "$RUNNER_TEMP/appimage.json"
          code=$?
          set -e
          tail -n 40 "$HOME/.local/share/labs.1bit.easyagent/logs/server.log" || true
          cat "$RUNNER_TEMP/appimage.json"
          test "$code" -eq 0
          python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ok'] else 1)" "$RUNNER_TEMP/appimage.json"
      - name: The rpm carries the runtime
        run: |
          sudo apt-get install -y rpm
          rpm -qlp dist/*.rpm | grep -E 'runtime/python-x86_64-unknown-linux-gnu.tar.gz$'

  release:
    needs: [windows, macos, linux, smoke-windows, smoke-macos, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 << 'PY'
          import os
          import pathlib
          import re
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## (?:\[)?{re.escape(version)}(?:\])?[^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.M | re.S,
          )
          notes = match.group(1).strip() if match else f"EasyAgent {version}."
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Require every installer
        run: |
          find release-assets -type f -print
          missing=0
          for ext in exe msi dmg deb AppImage rpm; do
            if ! find release-assets -type f -name "*.${ext}" | grep -q .; then
              echo "missing *.${ext}"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyAgent ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
