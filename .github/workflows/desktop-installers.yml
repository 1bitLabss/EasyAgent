# Unsigned installers. Signing keys are not in this repo.
# Windows: NSIS and MSI. macOS: a universal dmg. Linux: deb and AppImage.
name: desktop installers

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build unsigned NSIS and MSI
        working-directory: desktop
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build an unsigned universal dmg
        working-directory: desktop
        run: npm run build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential pkg-config libssl-dev file
      - name: Install the desktop CLI
        working-directory: desktop
        run: npm install
      - name: Build unsigned deb and AppImage
        working-directory: desktop
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: easyagent-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
