# Full suite beside windows.yml. Containment prints SKIP or INCONCLUSIVE
# with a reason when sandbox-exec cannot run. It does not report PASS for that.
name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Containment self-test
        run: python -m easyagent selftest contain
