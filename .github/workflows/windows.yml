# Temp-only. `selftest contain` creates and deletes EasyAgent.Probe.
# It does not run `contain setup` and it does not keep an ACL.
name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Containment self-test
        run: python -m easyagent selftest contain
