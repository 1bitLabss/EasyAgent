[package]
name = "easyagent-desktop"
version = "0.1.0"
description = "Native window for the local EasyAgent server."
authors = ["Nathan / 1bitLabs"]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[lib]
name = "easyagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easyagent-supervisor = { path = "../supervisor" }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
