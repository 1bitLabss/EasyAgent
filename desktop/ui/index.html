<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EasyAgent</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1c1b19;
      color: #1c1b19;
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    .card {
      background: #f6f4ef;
      padding: 28px 32px;
      text-align: center;
    }
    svg { width: 120px; height: auto; }
    .tagline { margin: 12px 0 4px; font-weight: 600; }
    #status { margin: 0; color: #6f6a64; font-size: 14px; max-width: 520px; }
    #failure { display: none; margin-top: 12px; max-width: 520px; text-align: left; font-size: 14px; }
    #failure p { margin: 6px 0; }
    #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; user-select: all; background: #ebe7df; padding: 6px 8px; }
    #retry { margin-top: 10px; padding: 8px 18px; font: inherit; background: #1c1b19; color: #f6f4ef; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 46" shape-rendering="crispEdges" role="img" aria-label="EasyAgent">
      <g fill="#1c1b19"><rect x="14" y="0" width="8" height="8"/><rect x="17" y="8" width="2" height="3"/><rect x="10" y="11" width="16" height="1"/><rect x="8" y="12" width="20" height="1"/><rect x="7" y="13" width="22" height="12"/><rect x="8" y="25" width="20" height="1"/><rect x="10" y="26" width="16" height="1"/><rect x="15" y="27" width="6" height="2"/><rect x="10" y="29" width="16" height="1"/><rect x="8" y="30" width="20" height="8"/><rect x="10" y="38" width="16" height="1"/><rect x="5" y="24" width="4" height="3"/><rect x="3" y="21" width="4" height="4"/><rect x="2" y="19" width="3" height="3"/><rect x="26" y="31" width="3" height="6"/><rect x="27" y="36" width="3" height="2"/><rect x="12" y="39" width="4" height="4"/><rect x="20" y="39" width="4" height="4"/><rect x="10" y="43" width="7" height="2"/><rect x="19" y="43" width="7" height="2"/></g>
      <g fill="#f6f4ef"><rect x="11" y="14" width="14" height="1"/><rect x="9" y="15" width="18" height="8"/><rect x="11" y="23" width="14" height="1"/><rect x="11" y="32" width="14" height="5"/><rect x="16" y="2" width="1" height="1"/><rect x="15" y="3" width="2" height="1"/><rect x="16" y="4" width="1" height="1"/><rect x="16" y="5" width="1" height="1"/><rect x="15" y="6" width="3" height="1"/></g>
      <g fill="#1c1b19"><rect x="12" y="17" width="2" height="2"/><rect x="22" y="17" width="2" height="2"/><rect x="13" y="20" width="1" height="1"/><rect x="23" y="20" width="1" height="1"/><rect x="14" y="21" width="1" height="1"/><rect x="22" y="21" width="1" height="1"/><rect x="15" y="22" width="6" height="1"/><rect x="12" y="32" width="1" height="1"/><rect x="11" y="33" width="2" height="1"/><rect x="12" y="34" width="1" height="1"/><rect x="12" y="35" width="1" height="1"/><rect x="11" y="36" width="3" height="1"/><rect x="16" y="32" width="3" height="1"/><rect x="16" y="33" width="1" height="1"/><rect x="18" y="33" width="1" height="1"/><rect x="16" y="34" width="1" height="1"/><rect x="18" y="34" width="1" height="1"/><rect x="16" y="35" width="1" height="1"/><rect x="18" y="35" width="1" height="1"/><rect x="16" y="36" width="3" height="1"/><rect x="21" y="32" width="1" height="1"/><rect x="20" y="33" width="2" height="1"/><rect x="21" y="34" width="1" height="1"/><rect x="21" y="35" width="1" height="1"/><rect x="20" y="36" width="3" height="1"/></g>
    </svg>
    <p class="tagline">AI agents, made easy.</p>
    <p id="status">Starting EasyAgent…</p>
    <div id="failure" role="alert">
      <p><strong>EasyAgent did not start.</strong></p>
      <p id="reason"></p>
      <p>The server log is here:</p>
      <p id="log"></p>
      <button id="retry" type="button">Retry</button>
    </div>
  </div>
  <script>
    (function () {
      var ipc = window.__TAURI_INTERNALS__;
      var status = document.getElementById("status");
      var failure = document.getElementById("failure");
      function show(state) {
        if (state.state === "failed") {
          status.textContent = "";
          document.getElementById("reason").textContent = state.message || "";
          document.getElementById("log").textContent = state.log || "";
          failure.style.display = "block";
        } else if (state.state === "ready") {
          status.textContent = "Opening EasyAgent…";
          failure.style.display = "none";
          setTimeout(function () { location.replace(state.url); }, 1500);
          return false;
        } else {
          failure.style.display = "none";
          status.textContent = state.message || "Starting EasyAgent…";
        }
        return true;
      }
      function poll() {
        if (!ipc) {
          status.textContent = "Starting EasyAgent…";
          return;
        }
        ipc.invoke("startup_state").then(function (state) {
          if (show(state)) setTimeout(poll, 500);
        }, function (err) {
          status.textContent = "EasyAgent could not read its startup state: " + err;
          setTimeout(poll, 2000);
        });
      }
      document.getElementById("retry").addEventListener("click", function () {
        failure.style.display = "none";
        status.textContent = "Starting EasyAgent…";
        ipc.invoke("retry_start").then(function () { setTimeout(poll, 300); }, function () { setTimeout(poll, 300); });
      });
      poll();
    })();
  </script>
</body>
</html>
