[project]
name = "easyagent"
version = "0.3.5"
description = "AI agents, made easy."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["easyagent*"]

[tool.setuptools.package-data]
easyagent = ["static/**/*", "ui/**/*"]
