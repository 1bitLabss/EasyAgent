[project]
name = "easyagent"
version = "0.3.15-dev"
description = "AI agents, made easy."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "keyring>=25",
  "tzdata>=2024.1",
  "playwright>=1.40",
  "paramiko>=3.5",
  "pywinrm>=0.5",
  "websockets>=13",
  "pystray>=0.19",
  "pillow>=10.1",
  "segno>=1.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["easyagent*"]

[tool.setuptools.package-data]
easyagent = ["static/**/*", "ui/**/*"]
