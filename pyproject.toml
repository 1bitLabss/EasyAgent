[project]
name = "easyagent"
version = "0.3.40"
description = "AI agents, made easy."
requires-python = ">=3.11"
dependencies = [
  "fastapi~=0.143.0",
  "starlette~=1.8.0",
  "uvicorn~=0.54.0",
  "pydantic~=2.14.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography~=50.0",
  "keyring>=25",
  "tzdata>=2024.1",
  "playwright~=1.64.0",
  "paramiko~=5.0",
  "pywinrm>=0.5",
  "websockets~=17.0",
  "pystray>=0.19",
  "pillow>=10.1",
  "segno>=1.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["easyagent*"]

[tool.setuptools.package-data]
easyagent = ["static/**/*", "ui/**/*"]
